[project]
name = "ov-stitcher"
version = "0.1.0"
description = "Training-free open-vocabulary semantic segmentation with OV-Stitcher"
requires-python = "==3.10.*"
dependencies = [
    "addict==2.4.0",
    "ftfy==6.2.0",
    "huggingface-hub==0.34.4",
    "mmcv==2.1.0",
    "mmengine==0.10.7",
    "mmsegmentation==1.2.2",
    "numpy==1.26.4",
    "open_clip_torch==2.24.0",
    "opencv-python==4.6.0.66",
    "packaging==25.0",
    "Pillow==10.4.0",
    "prettytable==3.16.0",
    "PyYAML==6.0.2",
    "regex==2023.8.8",
    "rich==14.0.0",
    "safetensors==0.4.3",
    "scikit-learn==1.7.0",
    "scipy==1.14.0",
    # MMEngine collects CUDA metadata via torch.utils.cpp_extension at startup.
    "setuptools==69.5.1",
    "termcolor==3.1.0",
    "timm==1.0.15",
    "torch==2.1.0",
    "torchvision==0.16.0",
    "tqdm==4.66.1",
    "yapf==0.43.0",
]

[tool.uv]
# The published MMCV CUDA wheel used here targets Linux x86_64 and Python 3.10.
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64' and implementation_name == 'cpython' and python_version == '3.10'",
]
package = false

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

# Keep uv's resolution stable even if a machine has a user-level mirror set.
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
mmcv = { url = "https://download.openmmlab.com/mmcv/dist/cu121/torch2.1.0/mmcv-2.1.0-cp310-cp310-manylinux1_x86_64.whl" }
